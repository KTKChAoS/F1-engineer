name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build solution
        run: dotnet build PitWall/PitWall.sln --configuration Release
      - name: Run .NET tests
        run: dotnet test PitWall/PitWall.sln --configuration Release --no-build
      - name: Build web client
        working-directory: PitWall/src/PitWall.Web
        run: |
          npm ci
          npm run build
